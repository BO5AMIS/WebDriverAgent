name: Tapwright runner

# Builds the same unsigned real-device runner Appium ships as
# WebDriverAgentRunner-Runner.zip (same script, Xcode and runner image as
# Appium's publish workflow at v16.15.3).

on:
  push:
    branches: [tapwright]
    tags: ['tw-*']
  workflow_dispatch:

permissions:
  contents: write

env:
  XCODE_VERSION: '16.4'

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}
      - name: Build the unsigned iOS runner
        run: sh "$GITHUB_WORKSPACE/Scripts/ci/build-real.sh"
        env:
          DERIVED_DATA_PATH: appium_wda_ios
          SCHEME: WebDriverAgentRunner
          DESTINATION: generic/platform=iOS
          WD: appium_wda_ios/Build/Products/Debug-iphoneos
          ZIP_PKG_NAME: WebDriverAgentRunner-Runner.zip
      - name: Checksum
        run: shasum -a 256 WebDriverAgentRunner-Runner.zip
      - uses: actions/upload-artifact@v4
        with:
          name: WebDriverAgentRunner-Runner
          path: WebDriverAgentRunner-Runner.zip
      - name: Release
        if: startsWith(github.ref, 'refs/tags/tw-')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" WebDriverAgentRunner-Runner.zip \
            --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" \
            --notes "Tapwright build of WebDriverAgent: appium/WebDriverAgent v16.15.3 plus Tapwright's routes (see WebDriverAgentLib/Commands/TWFastTapCommands.m)."
